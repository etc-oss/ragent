name: CI

# Prepared for when ragent is published. The jail + workspace need Linux
# (bubblewrap), so everything runs on ubuntu-latest.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Enable unprivileged user namespaces (bubblewrap prerequisite)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: Confinement negative-control gate
        run: bash tools/confinement-test.sh

  tests:
    # The Python suites that DON'T need the jail: the rate-limit wait layer (stdlib
    # only) and the forge adapter + 6b review loop (against an ephemeral Forgejo — no
    # bubblewrap, so these run on stock CI runners). The jail itself is covered by the
    # flake-check job's confinement gate above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Rate-limit wait layer (stdlib only)
        run: python3 tests/test_limit_wait.py
      - name: Forge adapter + 6b review loop (ephemeral Forgejo)
        run: nix shell nixpkgs#forgejo nixpkgs#git nixpkgs#python3 --command bash -c 'python3 tests/test_forgejo_adapter.py && python3 tests/test_review_loop.py'

  docs-sync:
    # The generated HTML must be committed in sync with docs/knowledge/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the OKF HTML view
        run: python3 tools/okf_render.py
      - name: Fail if docs/html is out of sync
        run: |
          git diff --exit-code -- docs/html || {
            echo "::error::docs/html is stale — run 'python3 tools/okf_render.py' and commit."
            exit 1
          }
