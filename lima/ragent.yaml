# lima/ragent.yaml — a dedicated Linux guest for ragent's jail (ADR-0004).
#
#   limactl start --name=ragent lima/ragent.yaml
#   limactl shell ragent
#   cd <this repo, inside the guest> && ./tools/confinement-test.sh
#
# Deliberately a FRESH, dedicated VM — not your existing VMs — so experiments are
# disposable (`limactl delete ragent`). Validate the provisioning in-guest; it is
# written from the docs but has not been run on this host.

vmType: "vz"          # fast on Apple Silicon; use "qemu" for broader compatibility
cpus: 4
memory: "8GiB"
disk: "60GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

mounts:
  # The jail only ever binds the project's cwd (mount-cwd); this guest-level mount
  # just lets the guest see the flake. Point it at the repo/project you're working
  # on. Writable so `nix build` and the confinement test can run.
  - location: "~"
    writable: true

provision:
  # 1) bubblewrap prerequisite: allow unprivileged user namespaces (Ubuntu 24.04
  #    restricts them behind AppArmor by default).
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      echo "kernel.apparmor_restrict_unprivileged_userns=0" > /etc/sysctl.d/99-ragent-userns.conf
      sysctl --system || true

  # 2) cgroup delegation so `systemd-run --user --scope` can enforce CPU/memory
  #    caps (ADR-0015). Without this the caps silently no-op.
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      mkdir -p /etc/systemd/system/user@.service.d
      cat > /etc/systemd/system/user@.service.d/delegate.conf <<'EOF'
      [Service]
      Delegate=cpu cpuset io memory pids
      EOF
      systemctl daemon-reload || true

  # 3) Nix with flakes (single-user install for the lima user).
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      if ! command -v nix >/dev/null 2>&1; then
        sh <(curl -L https://nixos.org/nix/install) --no-daemon
      fi
      mkdir -p "$HOME/.config/nix"
      grep -q 'experimental-features' "$HOME/.config/nix/nix.conf" 2>/dev/null || \
        echo "experimental-features = nix-command flakes" >> "$HOME/.config/nix/nix.conf"

probes:
  - description: "nix is on PATH"
    script: |
      #!/bin/bash
      set -eux
      timeout 60 bash -c "until command -v nix >/dev/null 2>&1; do sleep 3; done"
    hint: "nix did not install; check the user provisioning script logs."
