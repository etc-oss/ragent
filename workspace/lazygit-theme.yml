# Neon lazygit theme — Tokyo Night Moon (bright blue/purple accents, no green).
# Applied by tools/ragent-workspace.sh via LG_CONFIG_FILE.
gui:
  theme:
    activeBorderColor:
      - "#82aaff"   # bright blue
      - bold
    inactiveBorderColor:
      - "#589ed7"   # dim cyan
    optionsTextColor:
      - "#86e1fc"   # bright cyan
    selectedLineBgColor:
      - "#2d3f76"   # selection
    cherryPickedCommitBgColor:
      - "#3b4261"
    cherryPickedCommitFgColor:
      - "#c099ff"   # bright purple
    unstagedChangesColor:
      - "#ff757f"   # bright red
    defaultFgColor:
      - "#c8d3f5"   # fg
    searchingActiveBorderColor:
      - "#ffc777"   # bright yellow
  authorColorDefault: "#c099ff"  # bright purple
